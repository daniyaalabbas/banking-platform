name: Banking Platform CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  IMAGE_NAME: daniyaalabbas/banking-backend

jobs:
  test:
    name: Run Unit & Health Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test application health endpoint
        run: |
          python3 -c "from app import app; client=app.test_client(); response=client.get('/health'); assert response.status_code == 200; print('Health check passed:', response.json)"

  deploy:
    name: Build, Push & Deploy to OpenShift
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Immutable Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./services/backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "latest"

      - name: Authenticate with OpenShift
        run: |
          oc login \
            --server="${{ secrets.OPENSHIFT_SERVER }}" \
            --token="${{ secrets.OPENSHIFT_TOKEN }}" \
            --insecure-skip-tls-verify=false
          oc project "${{ secrets.OPENSHIFT_NAMESPACE }}"

      - name: Apply Manifests and Deploy Image
        run: |
          oc apply -f k8s/
          oc set image deployment/banking-backend banking-backend=${{ env.IMAGE_NAME }}:${{ github.sha }}
          oc rollout status deployment/banking-backend --timeout=120s

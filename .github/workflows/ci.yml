name: Production CI & GitOps Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: daniyaalabbas/banking-backend

jobs:
  # 1. TEST
  test:
    name: Unit & Health Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test application health endpoint
        run: |
          python3 -c "from app import app; client=app.test_client(); response=client.get('/health'); assert response.status_code == 200; print('Health check passed:', response.json)"

  # 2. BUILD, PUSH & GITOPS MANIFEST UPDATE (Runs only on merge to main)
  release:
    name: Build Artifact & Update GitOps Manifest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Immutable Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./services/backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update Image Tag in Kubernetes Manifest (GitOps)
        run: |
          # Update image tag inside k8s/backend-deployment.yaml using sed
          sed -i "s|image: ${{ env.IMAGE_NAME }}:.*|image: ${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/backend-deployment.yaml

          # Commit change back to the repository
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend-deployment.yaml
          git commit -m "chore(gitops): update backend image to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push origin main

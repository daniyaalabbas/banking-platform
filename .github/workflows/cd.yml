name: Backend CD

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: daniyaalabbas/banking-backend

jobs:
  deploy:
    name: Build, Push & Deploy to OpenShift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./services/backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Install OpenShift CLI (oc)
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "latest"

      - name: Authenticate with OpenShift
        run: |
          oc login \
            --server="${{ secrets.OPENSHIFT_SERVER }}" \
            --token="${{ secrets.OPENSHIFT_TOKEN }}" \
            --insecure-skip-tls-verify=false
          oc project "${{ secrets.OPENSHIFT_NAMESPACE }}"

      - name: Apply Manifests and Update Image
        run: |
          # Apply declarative manifests from k8s folder
          oc apply -f k8s/

          # Update the deployment to use the immutable commit SHA tag
          oc set image deployment/banking-backend banking-backend=${{ env.IMAGE_NAME }}:${{ github.sha }}

          # Wait for zero-downtime rollout to verify success
          oc rollout status deployment/banking-backend --timeout=120s

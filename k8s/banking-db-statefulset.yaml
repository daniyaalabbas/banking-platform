apiVersion: v1
kind: Service
metadata:
  name: banking-db
  labels:
    app: banking-db
spec:
  clusterIP: None
  selector:
    app: banking-db
  ports:
    - name: tcp
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: banking-db
  labels:
    app: banking-db
spec:
  serviceName: "banking-db"
  replicas: 2
  selector:
    matchLabels:
      app: banking-db
  template:
    metadata:
      labels:
        app: banking-db
    spec:
      containers:
        - name: db-node
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Node identity: $HOSTNAME" >> /var/lib/data/node.info
              while true; do
                echo "$(date) - Heartbeat from $HOSTNAME" >> /var/lib/data/heartbeat.log
                sleep 5
              done
          volumeMounts:
            - name: data
              mountPath: /var/lib/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
